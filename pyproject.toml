[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Standalone CLIs add the repository root before importing app modules.
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]
